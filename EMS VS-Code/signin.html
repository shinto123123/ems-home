<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Paoyaila Animation Studio</title>
  <style>
    :root {
      --bg: #0a1226;
      --canvas: #0f1836;
      --surface: #171f44;
      --surface-soft: rgba(255,255,255,0.08);
      --text: #edf2ff;
      --muted: #9ab3dc;
      --accent: #2bb7ff;
      --accent-strong: #45d0ff;
      --success: #2ce27a;
      --border: rgba(255,255,255,0.12);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      --radius: 24px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(67, 156, 255, 0.18), transparent 25%),
                  radial-gradient(circle at right, rgba(72, 203, 255, 0.14), transparent 18%),
                  linear-gradient(180deg, #08101f 0%, #0a1226 100%);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.08), transparent 22%),
                  radial-gradient(circle at 80% 15%, rgba(0, 183, 255, 0.14), transparent 18%);
      pointer-events: none;
    }
    .auth-container {
      width: min(480px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.8s ease forwards;
    }
    .auth-card {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      padding: 44px 40px;
      box-shadow: var(--shadow);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-header .brand img {
      width: 100px;
      height: auto;
      display: block;
      margin: 0 auto 12px;
    }
    .auth-header h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }
    .auth-header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .role-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    .role-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .role-option label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 10px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      position: relative;
    }
    .role-option label:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(67,156,255,0.35);
      color: var(--text);
    }
    .role-option input:checked + label {
      background: rgba(43,183,255,0.14);
      border-color: rgba(67,156,255,0.55);
      color: var(--text);
      box-shadow: 0 0 0 4px rgba(43,183,255,0.08);
    }
    .role-icon {
      font-size: 1.6rem;
      line-height: 1;
    }
    .auth-form {
      display: grid;
      gap: 18px;
    }
    .auth-form label {
      display: grid;
      gap: 8px;
      font-size: 0.92rem;
      color: var(--muted);
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper input {
      width: 100%;
      padding: 16px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .input-wrapper input::placeholder {
      color: rgba(154,179,220,0.7);
    }
    .input-wrapper input:focus {
      border-color: rgba(43,183,255,0.55);
      box-shadow: 0 0 0 4px rgba(43,183,255,0.12);
    }
    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      color: var(--muted);
      cursor: pointer;
    }
    .checkbox-label input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .forgot-link {
      font-size: 0.88rem;
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .forgot-link:hover {
      color: var(--accent-strong);
    }
    .auth-form button {
      border: none;
      border-radius: 18px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #2bb7ff, #57eeff);
      color: #08101f;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 6px;
    }
    .auth-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 48px rgba(43,183,255,0.28);
    }
    .auth-form button:active {
      transform: translateY(0);
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 0.85rem;
      margin: 4px 0;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }
    .social-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .social-btn:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(67,156,255,0.35);
      transform: translateY(-1px);
    }
    .social-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .auth-footer a:hover {
      color: var(--accent-strong);
    }
    .demo-hint {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.6;
      text-align: center;
    }
    .demo-hint strong {
      color: var(--text);
    }
    .auth-error {
      display: none;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fca5a5;
      font-size: 0.85rem;
      text-align: center;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media (max-width: 520px) {
      .auth-card { padding: 28px 20px; }
      .role-selector { grid-template-columns: 1fr 1fr; }
      .social-buttons { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="paoyaila-logo.svg" alt="Paoyaila Animation Studio logo" />
        <h1>Welcome back</h1>
        <p>Sign in to access your dashboard</p>
      </div>

      <form class="auth-form" id="signinForm" novalidate>
        <div class="role-selector" role="radiogroup" aria-label="User role">
          <div class="role-option">
            <input type="radio" name="role" id="role-admin" value="admin" />
            <label for="role-admin">
              <span class="role-icon">&#128104;&#8205;&#128188;</span>
              <span>Admin</span>
            </label>
          </div>
          <div class="role-option">
            <input type="radio" name="role" id="role-manager" value="manager" />
            <label for="role-manager">
              <span class="role-icon">&#128104;&#8205;&#128187;</span>
              <span>Manager</span>
            </label>
          </div>
          <div class="role-option">
            <input type="radio" name="role" id="role-hr" value="hr" />
            <label for="role-hr">
              <span class="role-icon">&#128188;</span>
              <span>HR</span>
            </label>
          </div>
          <div class="role-option">
            <input type="radio" name="role" id="role-employee" value="employee" checked />
            <label for="role-employee">
              <span class="role-icon">&#128100;</span>
              <span>Employee</span>
            </label>
          </div>
          <div class="role-option">
            <input type="radio" name="role" id="role-intern" value="intern" />
            <label for="role-intern">
              <span class="role-icon">&#127891;</span>
              <span>Intern</span>
            </label>
          </div>
        </div>

        <label>
          Email Address
          <div class="input-wrapper">
            <input type="email" name="email" placeholder="you@paoyaila.com" required autocomplete="email" />
          </div>
        </label>

        <label>
          Password
          <div class="input-wrapper">
            <input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password" />
          </div>
        </label>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" name="remember" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <div class="auth-error" id="authError"></div>

        <button type="submit" id="signinSubmitBtn">Sign In</button>
      </form>

      <div class="auth-divider">or</div>

      <div class="social-buttons">
        <button type="button" class="social-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button type="button" class="social-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
          GitHub
        </button>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="#">Contact Admin</a>
      </div>

      <div class="demo-hint">
        <strong>Note:</strong> Sign in with an account created by an Admin (via Employee/Internship management). Your role and dashboard are looked up from the database, not the button above.
      </div>
    </div>
  </div>

  <script type="module">
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { auth, db } from "./assets/js/firebase-config.js";
    import { onLogin } from "./assets/js/auth-session.js";

    const dashboardByRole = {
      admin: "Admin/index.html",
      manager: "manager/index.html",
      hr: "HR/index.html",
      employee: "Employee/index.html",
      intern: "Intern/index.html"
    };

    const form = document.getElementById('signinForm');
    const errorBox = document.getElementById('authError');
    const submitBtn = document.getElementById('signinSubmitBtn');

    function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = 'block';
    }

    async function findProfile(uid) {
        const employeeSnap = await getDocs(query(collection(db, "employees"), where("uid", "==", uid)));
        if (!employeeSnap.empty) {
            const docSnap = employeeSnap.docs[0];
            const data = docSnap.data();
            return { docId: docSnap.id, name: data.name, role: data.role || "employee" };
        }

        const internSnap = await getDocs(query(collection(db, "interns"), where("uid", "==", uid)));
        if (!internSnap.empty) {
            const docSnap = internSnap.docs[0];
            const data = docSnap.data();
            return { docId: docSnap.id, name: data.internName || data.name, role: "intern" };
        }

        return null;
    }

    form.addEventListener('submit', async function(event) {
        event.preventDefault();
        errorBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in...";

        const email = form.querySelector('input[name="email"]').value.trim();
        const password = form.querySelector('input[name="password"]').value;

        try {
            const credential = await signInWithEmailAndPassword(auth, email, password);
            const profile = await findProfile(credential.user.uid);

            if (!profile) {
                showError("No employee or intern profile is linked to this account. Contact Admin.");
                return;
            }

            onLogin({ uid: credential.user.uid, role: profile.role, name: profile.name, email, docId: profile.docId });
            window.location.href = dashboardByRole[profile.role] || dashboardByRole.employee;

        } catch (error) {
            if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                showError("Incorrect email or password.");
            } else {
                showError("Sign in failed: " + error.message);
            }
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Sign In";
        }
    });
  </script>
</body>
</html>
