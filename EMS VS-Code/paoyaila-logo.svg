<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <defs>
    <linearGradient id="paoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="paoGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="paoGrad3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="paoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (3D Isometric Play/Polygon Prism) -->
  <g transform="translate(8, 8)">
    <!-- Back Glow Aura -->
    <polygon points="32,4 60,20 60,52 32,68 4,52 4,20" fill="url(#paoGrad1)" opacity="0.25" filter="url(#paoGlow)" />
    
    <!-- Isometric Cube / Prism Facets -->
    <!-- Top Face -->
    <polygon points="32,4 58,19 32,34 6,19" fill="url(#paoGrad1)" />
    <!-- Left Face -->
    <polygon points="6,19 32,34 32,64 6,49" fill="url(#paoGrad2)" opacity="0.9" />
    <!-- Right Face -->
    <polygon points="32,34 58,19 58,49 32,64" fill="url(#paoGrad3)" opacity="0.95" />
    
    <!-- Central Play Arrow Inset -->
    <polygon points="26,24 44,34 26,44" fill="#ffffff" opacity="0.95" />
    <circle cx="32" cy="34" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Brand Typography -->
  <!-- Main Name: PAOYAILA -->
  <text x="80" y="42" font-family="'Space Grotesk', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" letter-spacing="1.5" fill="#ffffff">
    PAOYAILA
  </text>
  <text x="238" y="42" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#38bdf8">.</text>

  <!-- Subtitle: ANIMATION STUDIOS -->
  <text x="81" y="60" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="9" font-weight="700" letter-spacing="4.2" fill="#94a3b8">
    ANIMATION STUDIOS
  </text>
  
  <!-- Subtle Tag Indicator -->
  <rect x="234" y="52" width="22" height="9" rx="4.5" fill="rgba(56,189,248,0.2)" stroke="rgba(56,189,248,0.5)" stroke-width="0.75" />
  <text x="238" y="59" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="800" fill="#38bdf8">LLP</text>
</svg>
