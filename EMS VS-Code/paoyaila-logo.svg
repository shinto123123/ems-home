<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <defs>
    <linearGradient id="paoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0d60" />
      <stop offset="50%" stop-color="#38064a" />
      <stop offset="100%" stop-color="#27c485" />
    </linearGradient>
    <linearGradient id="paoGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38064a" />
      <stop offset="100%" stop-color="#6b1487" />
    </linearGradient>
    <linearGradient id="paoGrad3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#581070" />
      <stop offset="100%" stop-color="#27c485" />
    </linearGradient>
  </defs>

  <!-- Logo Mark (3D Isometric Play/Polygon Prism) -->
  <g transform="translate(8, 8)">
    <!-- Isometric Cube / Prism Facets -->
    <!-- Top Face -->
    <polygon points="32,4 58,19 32,34 6,19" fill="url(#paoGrad1)" />
    <!-- Left Face -->
    <polygon points="6,19 32,34 32,64 6,49" fill="url(#paoGrad2)" opacity="0.95" />
    <!-- Right Face -->
    <polygon points="32,34 58,19 58,49 32,64" fill="url(#paoGrad3)" opacity="0.95" />
    
    <!-- Central Play Arrow Inset -->
    <polygon points="26,24 44,34 26,44" fill="#ffffff" opacity="0.95" />
    <circle cx="32" cy="34" r="2.5" fill="#27c485" />
  </g>

  <!-- Brand Typography in PDF Deep Violet -->
  <!-- Main Name: PAOYAILA -->
  <text x="80" y="42" font-family="'Space Grotesk', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" letter-spacing="1.5" fill="#38064a">
    PAOYAILA
  </text>
  <text x="238" y="42" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#27c485">.</text>

  <!-- Subtitle: TECHNOLOGIES & CREATIVE STUDIO -->
  <text x="81" y="60" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" letter-spacing="3.2" fill="#6d4f7c">
    TECHNOLOGIES &amp; CREATIVE STUDIO
  </text>
  
  <!-- Subtle Tag Indicator -->
  <rect x="256" y="52" width="22" height="9" rx="4.5" fill="rgba(39,196,133,0.15)" stroke="#27c485" stroke-width="0.8" />
  <text x="260" y="59" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="800" fill="#1b8559">LLP</text>
</svg>
